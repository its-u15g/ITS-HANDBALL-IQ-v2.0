const cats=['すべて',...new Set(Q.map(q=>q.cat))];$('cat').innerHTML=cats.map(c=>`<option>${c}</option>`).join('');const key='itsIQv2';let db={records:[],session:null};try{let d=JSON.parse(localStorage.getItem(key));if(d&&Array.isArray(d.records))db=d}catch{}function save(){try{localStorage.setItem(key,JSON.stringify(db));return true}catch{$('notice').textContent='保存できません。ブラウザの設定を確認してください。';return false}}const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};let s,q,raf=0,playing=false,elapsed=0,last=0,ready=false,selected=-1,reason=-1,started=0,active=0,stage='watch';const duration=2200;const byId=id=>Q.find(q=>q.id===id);function stop(){cancelAnimationFrame(raf);playing=false}function screen(id){for(let x of ['home','quiz','result'])$(x).hidden=x!==id}function home(){stop();ready=false;stage='watch';screen('home');$('resume').hidden=!db.session;$('review').disabled=!weak().length;$('notice').textContent=`収録 ${Q.length}問 ／ 回答記録 ${db.records.length}件`;try{localStorage.setItem(key,JSON.stringify(db))}catch{$('notice').textContent+=' ／ 保存不可'}}function weak(){let m=new Map;db.records.forEach(r=>m.set(r.id,r));return [...m.values()].filter(r=>r.score<3||!r.reason).map(r=>r.id).filter(byId)}function start(review=false){let pool=review?weak().map(byId):Q.filter(q=>['すべて',q.cat].includes($('cat').value)&&['すべて',q.level].includes($('level').value)&&['すべて',q.role].includes($('role').value));if(!pool.length){$('notice').textContent='条件に合う問題がありません。';return}if(db.session&&!confirm('中断中のトレーニングを置き換えますか？'))return;s={ids:shuffle(pool.map(q=>q.id)).slice(0,+$('count').value),pos:0,answers:[],mode:$('mode').value};db.session=s;save();show()}
function path(r){return r===6?'M2.5 0 A6 6 0 0 0 8.5 6 H11.5 A6 6 0 0 0 17.5 0':`M0 ${Math.sqrt(r*r-8.5*8.5)} A${r} ${r} 0 0 0 8.5 ${r} H11.5 A${r} ${r} 0 0 0 20 ${Math.sqrt(r*r-8.5*8.5)}`}
function endCourt(){return `<path d="${path(6)} Z" fill="#a9c8c4" stroke="white" stroke-width=".09"/><path d="${path(9)}" fill="none" stroke="white" stroke-width=".09" stroke-dasharray=".15 .15"/><path d="M9.5 7 H10.5 M9.925 4 H10.075" stroke="white" stroke-width=".09"/><rect x="8.5" y="-.45" width="3" height=".45" fill="#455b59" stroke="white" stroke-width=".07"/>`}
function pos(p,t){return [p.x+p.dx*t,p.y+p.dy*t]}function target(o,t){return typeof o.target==='string'?pos(q.players.find(p=>p.id===o.target),t):o.target}function draw(t){let h=q.full?40:20;let g=`<svg viewBox="-.6 -.7 21.2 ${h+1.4}" role="group" aria-label="ハンドボールコート"><rect width="20" height="${h}" fill="#e7d6b6" stroke="white" stroke-width=".1"/>${endCourt()}${q.full?`<g transform="translate(20 40) rotate(180)">${endCourt()}</g><path d="M0 20 H20" stroke="white" stroke-width=".1"/>`:''}<text x="10" y="${q.full?20:19.4}" font-size=".55" text-anchor="middle" fill="#36544d">${q.down?'攻撃方向 ↓':q.def?'相手の攻撃方向 ↑':'自チーム攻撃方向 ↑'}</text>`;for(let p of q.players){let [x,y]=pos(p,t),blue=p.id[0]==='B',col=blue?'#236b9c':'#b74d51',angle=(blue?(q.def?180:q.down&&q.cat===K?180:0):(q.def?0:q.down?180:180));g+=`<g transform="translate(${x} ${y})"><circle r=".86" fill="${p.id===q.you?'#e1f5d9':'none'}" stroke="${p.id===q.you?'#16836b':'none'}" stroke-width=".15"/><g transform="rotate(${angle})"><ellipse cy=".1" rx=".64" ry=".39" fill="${col}" stroke="white" stroke-width=".08"/><path d="M-.55 .05 L-.8 -.28 M.55 .05 L.8 -.28" stroke="${col}" stroke-width=".22" stroke-linecap="round"/><circle cy="-.35" r=".26" fill="#e9bc96" stroke="white" stroke-width=".05"/></g><text y=".95" font-size=".48" text-anchor="middle" fill="#173c36">${p.id===q.you?'YOU':p.id==='BK'?'GK':p.id.slice(1)}</text></g>`;if(p.id===q.ball)g+=`<circle cx="${x+.65}" cy="${y-.45}" r=".23" fill="#f39a20" stroke="#81511d" stroke-width=".07"/>`;}if(ready&&stage!=='feedback')q.opts.forEach((o,i)=>{if(!o.target)return;let [x,y]=target(o,t);g+=`<circle data-target="${i}" tabindex="0" role="button" aria-label="${o.label}" cx="${x}" cy="${y}" r=".94" fill="${selected===i?'#16836b':'#fff'}" fill-opacity="${selected===i?.28:.06}" stroke="${selected===i?'#16836b':'#425e56'}" stroke-width=".12" stroke-dasharray=".2 .15"/>`});$('court').innerHTML=g+'</svg>';if(ready)$('court').querySelectorAll('[data-target]').forEach(e=>{e.onclick=()=>choose(+e.dataset.target);e.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();choose(+e.dataset.target)}}})}
function tick(now){if(!playing)return;if(!last)last=now;elapsed+=Math.min(now-last,100);last=now;draw(Math.min(elapsed/duration,1));if(elapsed>=duration){freeze();return}raf=requestAnimationFrame(tick)}function play(){stop();playing=true;last=0;$('pause').textContent='一時停止';raf=requestAnimationFrame(tick)}function freeze(){stop();elapsed=duration;ready=true;stage='choose';started=performance.now();$('phase').textContent='判断場面：コートまたは選択肢をタップ';$('pause').disabled=true;$('skip').disabled=true;draw(1);renderChoices()}function show(){stop();q=byId(s.ids[s.pos]);if(!q){home();return}screen('quiz');selected=reason=-1;ready=false;elapsed=active=0;stage='watch';$('progress').textContent=`${s.pos+1} / ${s.ids.length}`;$('bar').style.width=`${s.pos/s.ids.length*100}%`;$('meta').textContent=`${q.cat} / ${q.level} / ${q.role}`;$('prompt').textContent=q.prompt;$('clock').textContent='';for(let id of ['feedback','next','reasons','submit'])$(id).hidden=true;$('choices').replaceChildren();$('phase').textContent='選手の動きを観察しよう';$('pause').disabled=$('skip').disabled=$('replay').disabled=false;draw(0);play()}
function buttons(el,items,fn,sel){el.replaceChildren();items.forEach(([i,label])=>{let b=document.createElement('button');b.className='wide'+(i===sel?' selected':'');b.textContent=label;b.onclick=()=>fn(i);el.append(b)})}let order=[],reasonOrder=[];function renderChoices(){if(!order.length)order=shuffle([0,1,2]);buttons($('choices'),order.map(i=>[i,q.opts[i].label]),choose,selected)}function choose(i){if(!ready||stage==='feedback')return;if(selected<0){active+=started?performance.now()-started:0}selected=i;stage='reason';draw(1);renderChoices();$('reasons').hidden=false;let labels=[q.reason,'ボールだけを見て決めればよい','味方や相手の位置は関係ない'];if(!reasonOrder.length)reasonOrder=shuffle([0,1,2]);buttons($('reasons'),reasonOrder.map(i=>[i,labels[i]]),i=>{reason=i;choose(selected)},reason);let h=document.createElement('h2');h.textContent='判断の理由は？';$('reasons').prepend(h);$('submit').hidden=false;$('submit').disabled=reason<0}
function submit(){if(stage!=='reason'||reason<0)return;stage='feedback';let r={id:q.id,score:q.opts[selected].score,reason:reason===0,sec:Math.round(active/100)/10,date:new Date().toISOString()};s.answers.push(r);db.records.push(r);db.session={...s,pos:s.pos+1};if(db.session.pos>=s.ids.length)db.session=null;save();$('feedback').hidden=false;$('feedback').innerHTML=`<strong>判断 ${r.score}/3点 ／ 理由 ${r.reason?'1':'0'}/1点</strong><p>${q.why}</p><p>推奨：${q.opts[0].label}<br>着眼点：${q.reason}</p>`;$('submit').hidden=true;$('next').hidden=false;$('next').textContent=s.pos+1===s.ids.length?'結果を見る':'次の問題';$('replay').disabled=true;for(let b of document.querySelectorAll('#choices button,#reasons button'))b.disabled=true;draw(1);$('bar').style.width=`${(s.pos+1)/s.ids.length*100}%`}
function summary(records,title){stop();screen('result');let el=$('result');el.replaceChildren();let n=records.length,avg=n?records.reduce((a,r)=>a+r.score,0)/n:0,rs=n?records.filter(r=>r.reason).length/n:0;el.innerHTML=`<h2>${title}</h2><div class="grid"><div>判断の質<div class="score">${avg.toFixed(1)}/3</div></div><div>理由正答率<div class="score">${Math.round(rs*100)}%</div></div><div>回答数<div class="score">${n}</div></div><div>平均判断時間<div class="score">${n?(records.reduce((a,r)=>a+r.sec,0)/n).toFixed(1):'—'}秒</div></div></div><h2>カテゴリー別</h2><table><tr><th>分野</th><th>判断平均</th><th>回答数</th></tr>${cats.slice(1).map(c=>{let a=records.filter(r=>byId(r.id)?.cat===c);return `<tr><td>${c}</td><td>${a.length?(a.reduce((s,r)=>s+r.score,0)/a.length).toFixed(1):'—'}</td><td>${a.length}</td></tr>`}).join('')}</table>`;let b=document.createElement('button');b.className='wide primary';b.textContent='ホームへ';b.onclick=home;el.append(b)}function next(){if(stage!=='feedback')return;if(++s.pos>=s.ids.length){summary(s.answers,'トレーニング結果');return}order=[];reasonOrder=[];show()}
$('start').onclick=()=>{order=[];reasonOrder=[];start()};$('review').onclick=()=>{order=[];reasonOrder=[];start(true)};$('resume').onclick=()=>{s=db.session;order=[];reasonOrder=[];show()};$('history').onclick=()=>summary(db.records,'学習記録');$('next').onclick=next;$('submit').onclick=submit;$('quit').onclick=home;$('skip').onclick=freeze;$('pause').onclick=()=>{if(playing){stop();$('pause').textContent='再生'}else play()};$('replay').onclick=()=>{if(stage==='feedback')return;selected=reason=-1;ready=false;elapsed=active=0;stage='watch';$('choices').replaceChildren();$('reasons').hidden=$('submit').hidden=true;$('pause').disabled=$('skip').disabled=false;$('phase').textContent='選手の動きを観察しよう';play()};document.addEventListener('visibilitychange',()=>{if(document.hidden){if(playing){stop();$('pause').textContent='再生'}if(ready&&selected<0&&stage==='choose'&&started){active+=performance.now()-started;started=0}}else if(ready&&selected<0&&stage==='choose')started=performance.now()});setInterval(()=>{if(s?.mode==='speed'&&ready&&stage!=='feedback'&&!$('quiz').hidden)$('clock').textContent=((active+(selected<0&&started?performance.now()-started:0))/1000).toFixed(1)+'秒'},150);home();
</script></body></html>
