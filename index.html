let mirrored=false, explaining=false;function pos(p,t){let u=Math.max(0,Math.min(1,(t-(p.id===q.ball?0:.12))/(p.id===q.ball?.78:.88)));let x=p.x+p.dx*u,y=p.y+p.dy*u;return [mirrored?20-x:x,y]}function target(o,t){return typeof o.target==='string'?pos(q.players.find(p=>p.id===o.target),t):(o.target&&mirrored?[20-o.target[0],o.target[1]]:o.target)}function draw(t){if(q.rule){$('court').innerHTML='';return}let h=q.full?40:20;let g=`<svg viewBox="-.6 -.7 21.2 ${h+1.4}" role="group" aria-label="ハンドボールコート"><rect width="20" height="${h}" fill="#e7d6b6" stroke="white" stroke-width=".1"/>${endCourt()}${q.full?`<g transform="translate(20 40) rotate(180)">${endCourt()}</g><path d="M0 20 H20" stroke="white" stroke-width=".1"/>`:''}<text x="10" y="${q.full?20:19.4}" font-size=".55" text-anchor="middle" fill="#36544d">${q.down?'攻撃方向 ↓':q.def?'相手の攻撃方向 ↑':'自チーム攻撃方向 ↑'}</text>`;for(let p of q.players){let [x,y]=pos(p,t),blue=p.id[0]==='B',col=blue?'#236b9c':'#b74d51',angle=(blue?(q.def?180:q.down&&q.cat===K?180:0):(q.def?0:q.down?180:180));g+=`<g transform="translate(${x} ${y})"><circle r=".86" fill="${p.id===q.you?'#e1f5d9':'none'}" stroke="${p.id===q.you?'#16836b':'none'}" stroke-width=".15"/><g transform="rotate(${angle})"><ellipse cy=".1" rx=".64" ry=".39" fill="${col}" stroke="white" stroke-width=".08"/><path d="M-.55 .05 L-.8 -.28 M.55 .05 L.8 -.28" stroke="${col}" stroke-width=".22" stroke-linecap="round"/><circle cy="-.35" r=".26" fill="#e9bc96" stroke="white" stroke-width=".05"/></g><text y=".95" font-size=".48" text-anchor="middle" fill="#173c36">${p.id===q.you?'YOU':p.id.endsWith('K')?'GK':p.id.slice(1)}</text></g>`;}let bp=q.players.find(p=>p.id===q.ball),ep=q.players.find(p=>p.id===(explaining?null:q.passTo));if(bp){let [x,y]=pos(bp,t);if(ep){let z=Math.max(0,Math.min(1,(t-.22)/.4)),a=pos(bp,.22),b=pos(ep,t);x=a[0]+(b[0]-a[0])*z;y=a[1]+(b[1]-a[1])*z;}g+=`<circle cx="${x+.45}" cy="${y-.35}" r=".26" fill="#f39a20" stroke="#81511d" stroke-width=".07"/>`;}if(explaining){let o=q.opts.reduce((a,b)=>a.score>=b.score?a:b),p=q.players.find(p=>p.id===q.you),v=target(o,1);if(p&&v){let a=pos(p,1);g+=`<path d="M${a.join(' ')} L${v.join(' ')}" stroke="#16836b" stroke-width=".22" stroke-dasharray=".35 .2"/><circle cx="${v[0]}" cy="${v[1]}" r=".8" fill="none" stroke="#16836b" stroke-width=".2"/>`;}}if(ready&&stage!=='feedback')q.opts.forEach((o,i)=>{if(!o.target)return;let [x,y]=target(o,t);if(q.opts.some((other,j)=>j!==i&&other.target&&Math.hypot(...target(other,t).map((v,k)=>v-[x,y][k]))<1.88))return;g+=`<circle data-target="${i}" tabindex="0" role="button" aria-label="${o.label}" cx="${x}" cy="${y}" r=".94" fill="${selected===i?'#16836b':'#fff'}" fill-opacity="${selected===i?.28:.06}" stroke="${selected===i?'#16836b':'#425e56'}" stroke-width=".12" stroke-dasharray=".2 .15"/>`});$('court').innerHTML=g+'</svg>';if(ready)$('court').querySelectorAll('[data-target]').forEach(e=>{e.onclick=()=>choose(+e.dataset.target);e.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();choose(+e.dataset.target)}}})}
function tick(now){if(!playing)return;if(!last)last=now;elapsed+=Math.min(now-last,100)*Number($('rate').value);last=now;draw(Math.min(elapsed/duration,1));if(elapsed>=duration){if(explaining){stop();explaining=false;$('demo').disabled=false;return}freeze();return}raf=requestAnimationFrame(tick)}function play(){stop();playing=true;last=0;$('pause').textContent='一時停止';raf=requestAnimationFrame(tick)}function freeze(){stop();elapsed=duration;ready=true;stage='choose';started=performance.now();$('phase').textContent='判断場面：コートまたは選択肢をタップ';$('pause').disabled=true;$('skip').disabled=true;draw(1);renderChoices()}function show(){stop();explaining=false;q=byId(s.ids[s.pos]);mirrored=!!s.mirror&&!!q&&!q.rule&&!/左|右|逆側/.test([q.prompt,q.why,q.reason,...q.opts.flatMap(o=>[o.label,...(o.reasons||[])])].join(''))&&Math.random()<.5;$('demo').hidden=true;$('viewControls').hidden=!!q?.rule;if(!q){home();return}screen('quiz');selected=reason=-1;ready=false;elapsed=active=0;stage='watch';$('progress').textContent=`${s.pos+1} / ${s.ids.length}`;$('bar').style.width=`${s.pos/s.ids.length*100}%`;document.querySelector('.legend').hidden=!!q.rule;for(let id of ['replay','pause','skip'])$(id).hidden=!!q.rule;$('meta').textContent=`${q.cat} / ${q.level} / ${q.role}`;$('prompt').textContent=q.prompt;$('clock').textContent='';for(let id of ['feedback','next','reasons','submit'])$(id).hidden=true;$('choices').replaceChildren();$('phase').textContent='選手の動きを観察しよう';$('pause').disabled=$('skip').disabled=$('replay').disabled=false;if(q.rule){freeze();$('phase').textContent='競技規則に基づいて回答しよう'}else{draw(0);play()}}
function buttons(el,items,fn,sel){el.replaceChildren();items.forEach(([i,label])=>{let b=document.createElement('button');b.className='wide'+(i===sel?' selected':'');b.textContent=label;b.onclick=()=>fn(i);el.append(b)})}let order=[],reasonOrder=[];function renderChoices(){if(!order.length)order=shuffle(q.opts.map((_,i)=>i));buttons($('choices'),order.map(i=>[i,q.opts[i].label]),choose,selected)}function choose(i){if(!ready||stage==='feedback')return;if(selected<0){active+=started?performance.now()-started:0}if(selected!==i){reason=-1;reasonOrder=[]}selected=i;stage='reason';draw(1);renderChoices();if(q.rule){reason=0;$('submit').hidden=false;$('submit').disabled=false;return}$('reasons').hidden=false;let labels=q.opts[selected].reasons;if(!reasonOrder.length)reasonOrder=shuffle([0,1,2]);buttons($('reasons'),reasonOrder.map(i=>[i,labels[i]]),i=>{reason=i;choose(selected)},reason);let h=document.createElement('h2');h.textContent='このプレーの利点・リスクを最も正確に説明しているのは？';$('reasons').prepend(h);$('submit').hidden=false;$('submit').disabled=reason<0}
function submit(){if(stage!=='reason'||reason<0)return;stage='feedback';let r={id:q.id,score:q.opts[selected].score,reason:q.rule?null:reason===0,sec:Math.round(active/100)/10,date:new Date().toISOString()};s.answers.push(r);db.records.push(r);db.session={...s,pos:s.pos+1};if(db.session.pos>=s.ids.length)db.session=null;save();$('feedback').hidden=false;$('feedback').innerHTML=`<strong>判断 ${r.score}/3点 ／ ${q.rule?'ルール判定':`理由 ${r.reason?'1':'0'}/1点`}</strong><p>${q.why}</p><p>推奨：${q.opts.reduce((a,b)=>a.score>=b.score?a:b).label}<br>選んだプレーの評価：${q.rule?q.why:q.opts[selected].reasons[0]}<br>推奨判断の着眼点：${q.reason}</p>`;$('submit').hidden=true;$('next').hidden=false;$('next').textContent=s.pos+1===s.ids.length?'結果を見る':'次の問題';$('replay').disabled=true;$('demo').hidden=q.rule;for(let b of document.querySelectorAll('#choices button,#reasons button'))b.disabled=true;draw(1);$('bar').style.width=`${(s.pos+1)/s.ids.length*100}%`}
function summary(records,title){stop();screen('result');let el=$('result');el.replaceChildren();let n=records.length,avg=n?records.reduce((a,r)=>a+r.score,0)/n:0,rs=records.some(r=>r.reason!==null)?records.filter(r=>r.reason).length/records.filter(r=>r.reason!==null).length:0;el.innerHTML=`<h2>${title}</h2><div class="grid"><div>判断の質<div class="score">${avg.toFixed(1)}/3</div></div><div>理由正答率<div class="score">${records.some(r=>r.reason!==null)?Math.round(rs*100)+'%':'未測定'}</div></div><div>回答数<div class="score">${n}</div></div><div>平均判断時間<div class="score">${n?(records.reduce((a,r)=>a+r.sec,0)/n).toFixed(1):'—'}秒</div></div></div><h2>カテゴリー別</h2><table><tr><th>分野</th><th>判断平均</th><th>回答数</th></tr>${cats.slice(1).map(c=>{let a=records.filter(r=>byId(r.id)?.cat===c);return `<tr><td>${c}</td><td>${a.length?(a.reduce((s,r)=>s+r.score,0)/a.length).toFixed(1):'—'}</td><td>${a.length}</td></tr>`}).join('')}</table>`;let tactical=records.filter(r=>!byId(r.id)?.rule),rules=records.filter(r=>byId(r.id)?.rule);let avgPct=a=>a.length?Math.round(a.reduce((n,r)=>n+r.score,0)/a.length/3*100):null;let axes=['OF','DF','速攻','切り替え','GK','ゲーム管理'];let vals=axes.map(x=>avgPct(tactical.filter(r=>byId(r.id)?.cat.startsWith(x))));let pt=(i,v)=>[150+Math.sin(i*Math.PI/3)*83*v/100,115-Math.cos(i*Math.PI/3)*83*v/100].join(',');let extra=document.createElement('div');extra.innerHTML=`<h2>戦術・ルール別</h2><p>戦術 ${avgPct(tactical)??'未測定'}${tactical.length?'%':''} ／ ルール ${avgPct(rules)??'未測定'}${rules.length?'%':''}</p><svg viewBox="0 0 300 230" aria-label="戦術理解度レーダー">${[25,50,75,100].map(v=>`<polygon points="${axes.map((_,i)=>pt(i,v)).join(' ')}" fill="none" stroke="#bdcec6"/>`).join('')}${axes.map((x,i)=>{let [a,b]=pt(i,125).split(',');return `<text x="${a}" y="${b}" text-anchor="middle" font-size="10">${x}</text>${vals[i]===null?'':`<circle cx="${pt(i,vals[i]).split(',')[0]}" cy="${pt(i,vals[i]).split(',')[1]}" r="4" fill="#176e60"/>`}`}).join('')}${vals.every(v=>v!==null)?`<polygon points="${vals.map((v,i)=>pt(i,v)).join(' ')}" fill="#176e6033" stroke="#176e60"/>`:''}</svg><p class="muted">未回答分野は点を表示しません。</p><h2>DFシステム別</h2>${['0-6','5-1','3-2-1','4-2'].map(x=>`<p>${x}：${['OF','DF'].map(side=>{let v=avgPct(tactical.filter(r=>byId(r.id)?.system===x&&byId(r.id)?.cat.startsWith(side)));return side+' '+(v===null?'未測定':v+'%')}).join(' ／ ')}</p>`).join('')}<p>復習対象：${weak().length}問（誤答後、直近2回満点で定着）</p>`;el.append(extra);let b=document.createElement('button');b.className='wide primary';b.textContent='ホームへ';b.onclick=home;el.append(b)}function next(){if(stage!=='feedback')return;if(++s.pos>=s.ids.length){summary(s.answers,'トレーニング結果');return}order=[];reasonOrder=[];show()}
$('start').onclick=()=>{order=[];reasonOrder=[];start()};$('review').onclick=()=>{order=[];reasonOrder=[];start(true)};$('resume').onclick=()=>{s=db.session;order=[];reasonOrder=[];show()};$('history').onclick=()=>summary(db.records,'学習記録');$('next').onclick=next;$('submit').onclick=submit;$('quit').onclick=home;$('skip').onclick=freeze;$('pause').onclick=()=>{if(playing){stop();$('pause').textContent='再生'}else play()};$('replay').onclick=()=>{if(stage==='feedback')return;selected=reason=-1;ready=false;elapsed=active=0;stage='watch';$('choices').replaceChildren();$('reasons').hidden=$('submit').hidden=true;$('pause').disabled=$('skip').disabled=false;$('phase').textContent='選手の動きを観察しよう';play()};document.addEventListener('visibilitychange',()=>{if(document.hidden){if(playing){stop();$('pause').textContent='再生'}if(ready&&selected<0&&stage==='choose'&&started){active+=performance.now()-started;started=0}}else if(ready&&selected<0&&stage==='choose')started=performance.now()});setInterval(()=>{if(s?.mode==='speed'&&ready&&stage!=='feedback'&&!$('quiz').hidden)$('clock').textContent=((active+(selected<0&&started?performance.now()-started:0))/1000).toFixed(1)+'秒'},150);
function recommendedTarget(){let o=q.opts.reduce((a,b)=>a.score>=b.score?a:b);return typeof o.target==='string'?o.target:null}
$('demo').onclick=()=>{if(stage!=='feedback')return;explaining=true;elapsed=0;$('demo').disabled=true;play()};
$('expand').onclick=()=>{let c=$('court');c.classList.add('expanded');let close=document.createElement('button');close.textContent='閉じる';close.onclick=()=>{c.classList.remove('expanded');close.remove()};c.append(close)};
// Preserve close control when SVG is redrawn.
const originalDraw=draw;draw=function(t){originalDraw(t);let c=$('court');if(c.classList.contains('expanded')){let b=document.createElement('button');b.textContent='閉じる';b.onclick=()=>{c.classList.remove('expanded');b.remove()};c.append(b)}};
$('export').onclick=()=>{let u=URL.createObjectURL(new Blob([JSON.stringify({version:24,records:db.records},null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='ITS-IQ-v24-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
$('import').onclick=()=>$('backup').click();$('backup').onchange=async()=>{try{let f=$('backup').files[0];if(!f)return;let d=JSON.parse(await f.text());if(![23,24].includes(d.version)||!Array.isArray(d.records)||!d.records.every(r=>byId(r.id)&&Number.isInteger(r.score)&&r.score>=0&&r.score<=3&&(r.reason===null||typeof r.reason==='boolean')&&Number.isFinite(r.sec)&&r.sec>=0&&typeof r.date==='string'&&Number.isFinite(Date.parse(r.date))))throw Error();if(confirm('現在の回答記録を置き換えますか？')){db={records:d.records,session:null};save();home()}}catch{$('notice').textContent='復元できません。v2.3のバックアップを選択してください。'}finally{$('backup').value=''}};

// v2.4: preserve v2.3 storage key and IDs.
const panel=$('courtPanel');

function poolCount(){let n=Q.filter(q=>['すべて',q.cat].includes($('cat').value)&&['すべて',q.level].includes($('level').value)&&(['すべて',q.role].includes($('role').value)||q.rule)&&($('system').value==='すべて'||q.system===$('system').value)).length;$('start').disabled=!n;$('start').textContent=`開始（${Math.min(n,+$('count').value)}問／該当${n}問）`}
for(let id of ['cat','level','role','system','count'])$(id).addEventListener('change',poolCount);
